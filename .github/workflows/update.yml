name: Daily market update

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC, after CoinGecko publishes the 00:00 UTC snapshot
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["tracker/**", "tests/**", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch data, rebuild charts and README
        if: github.event_name != 'push'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python -m tracker

      - name: Commit changes
        if: github.event_name != 'push'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add data charts README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: market update $(date -u +%F)"
            git push
          fi
